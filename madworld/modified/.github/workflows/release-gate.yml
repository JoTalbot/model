name: Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'android/**'
      - 'ops/**'
      - 'docs/**'
      - '.github/workflows/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madworld
          POSTGRES_PASSWORD: madworld
          POSTGRES_DB: madworld
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madworld -d madworld"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MADWORLD_DATABASE_URL: postgresql://madworld:madworld@localhost:5432/madworld
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Apply migrations
        run: python backend/scripts/migrate.py
      - name: Validate production Compose
        run: docker compose -f ops/docker-compose.production.yml config
      - name: Run backend release gate tests
        run: python -m pytest backend/tests -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Assemble production release APK
        run: gradle :app:assembleRelease -PMADWORLD_API_URL=https://api.autosklo.org.ua --no-daemon
      - name: Normalize release APK path
        run: |
          set -euo pipefail
          TARGET="app/build/outputs/apk/release/app-release.apk"
          APK="$(find app/build/outputs -type f -name '*.apk' -path '*/release/*' ! -path "$TARGET" | sort | head -n 1)"
          if [ -n "$APK" ]; then
            mkdir -p app/build/outputs/apk/release
            cp "$APK" "$TARGET"
          fi
          test -s "$TARGET"
      - name: Generate release checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - name: Upload release-gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: madworld-android-release-gate
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256

  android-matrix:
    name: Android API ${{ matrix.api }} smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 32, 35]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug -PMADWORLD_API_URL=https://example.invalid --no-daemon
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK emulator
        working-directory: .
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-${{ matrix.api }};google_apis;x86_64"
          echo "no" | avdmanager create avd -n "madworld-api-${{ matrix.api }}" -k "system-images;android-${{ matrix.api }};google_apis;x86_64" --force
      - name: Boot emulator
        working-directory: .
        run: |
          set -euo pipefail
          emulator -avd "madworld-api-${{ matrix.api }}" -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator-${{ matrix.api }}.log" 2>&1 &
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | grep -m1 "1"; do sleep 2; done'
          adb shell input keyevent 82
      - name: Install and launch APK
        working-directory: .
        run: |
          set -euo pipefail
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell am force-stop com.jotalbot.madworld
          adb shell monkey -p com.jotalbot.madworld 1
          sleep 5
          adb shell pidof com.jotalbot.madworld
          adb shell dumpsys package com.jotalbot.madworld | grep -E 'versionName|versionCode'
      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-log-${{ matrix.api }}
          path: ${{ runner.temp }}/emulator-${{ matrix.api }}.log

  gate:
    runs-on: ubuntu-latest
    needs: [backend, android, android-matrix]
    steps:
      - name: Release gate passed
        run: echo "Repository-side release gate passed. External production-owner checks remain required before production release."