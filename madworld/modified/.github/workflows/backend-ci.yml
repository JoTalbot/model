name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: madworld
          POSTGRES_USER: madworld
          POSTGRES_DB: madworld_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madworld -d madworld_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MADWORLD_DATABASE_URL: postgresql+psycopg://madworld:madworld@localhost:5432/madworld_test
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest ruff mypy
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Type check (mypy, scoped)
        run: python -m mypy
      - name: OpenAPI contract is current
        run: python scripts/export_openapi.py --check
      - name: Apply database migrations
        run: python scripts/migrate.py
      - name: Verify application module resolution
        run: python -c "import app.main; print(app.main.__file__); paths=set(app.main.app.openapi()['paths']); print('routes=', len(paths)); assert '/api/v1/travel/plan' in paths"
      - name: Validate production compose
        working-directory: .
        env:
          MADWORLD_DATABASE_URL: postgresql://madworld:madworld@localhost:5432/madworld_test
        run: docker compose -f ops/docker-compose.production.yml config
      - name: Run tests
        run: python -m pytest -q
