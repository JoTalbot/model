name: Remote Operator Post-Deploy Root Verification

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for matching deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 600 ))
          while (( $(date +%s) < deadline )); do
            run_json=$(gh run list --repo "$REPOSITORY" --workflow deploy-on-push.yml --event push --limit 20 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == "'"$DEPLOY_SHA"'")' | head -n1 || true)
            if [[ -n "$run_json" ]]; then
              run_id=$(printf '%s' "$run_json" | jq -r '.databaseId')
              status=$(printf '%s' "$run_json" | jq -r '.status')
              conclusion=$(printf '%s' "$run_json" | jq -r '.conclusion // empty')
              echo "DEPLOY_RUN_ID=$run_id"
              echo "DEPLOY_STATUS=$status"
              echo "DEPLOY_CONCLUSION=$conclusion"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || { echo 'Matching deployment failed.' >&2; exit 1; }
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for matching deployment.' >&2
          exit 1

      - name: Dispatch Remote Operator root verification
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run remote-operator.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f operation=command \
            -f mode=sync \
            -f timeout_minutes=5 \
            -f cleanup=true \
            -f command=$'set -euo pipefail\nprintf "ROOT_RUNTIME_VERIFY_START\\n"\nprintf "HOST=%s\\n" "$(hostname)"\nprintf "EUID=%s\\n" "$(id -u)"\nprintf "USER=%s\\n" "$(id -un)"\nprintf "ROOT=%s\\n" "$(if [[ $(id -u) -eq 0 ]]; then echo yes; else echo no; fi)"\nprintf "REMOTE_HEAD=%s\\n" "$(git -C /opt/madworld rev-parse HEAD 2>/dev/null || echo unknown)"\nprintf "ROOT_RUNTIME_VERIFY_END\\n"'
          echo 'Remote Operator dispatch requested.'

      - name: Poll Remote Operator result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 600 ))
          run_id=''
          while (( $(date +%s) < deadline )); do
            run_id=$(gh run list --repo "$REPOSITORY" --workflow remote-operator.yml --event workflow_dispatch --limit 20 --json databaseId,createdAt,status,conclusion --jq '.[] | .databaseId' | head -n1 || true)
            if [[ -n "$run_id" ]]; then
              echo "REMOTE_OPERATOR_RUN_ID=$run_id"
              status=$(gh run view "$run_id" --repo "$REPOSITORY" --json status --jq '.status')
              echo "REMOTE_OPERATOR_STATUS=$status"
              if [[ "$status" == completed ]]; then
                conclusion=$(gh run view "$run_id" --repo "$REPOSITORY" --json conclusion --jq '.conclusion')
                echo "REMOTE_OPERATOR_CONCLUSION=$conclusion"
                gh run download "$run_id" --repo "$REPOSITORY" --name remote-operator-result --dir "$RUNNER_TEMP/remote-result"
                test -s "$RUNNER_TEMP/remote-result/result.json"
                cat "$RUNNER_TEMP/remote-result/result.json"
                python3 - "$RUNNER_TEMP/remote-result/result.json" <<'PY'
import json, sys
p = sys.argv[1]
d = json.load(open(p, encoding='utf-8'))
assert d.get('status') == 'SUCCESS', d
assert d.get('run_as') == 'root', d
assert d.get('exit_code') == 0, d
print('ROOT_RUNTIME_VERIFICATION=PASS')
PY
                [[ "$conclusion" == success ]]
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for Remote Operator result.' >&2
          exit 1
