[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octopus-gemaxi"
version = "0.1.0"
description = "Local-first personal memory OS and immortal P2P AI swarm"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "JoTalbot" }]
license = { text = "MIT" }
keywords = ["p2p", "memory", "agents", "rag", "llm"]
dependencies = [
  "kademlia>=2.2.2",
  "reedsolo>=1.7.0",
  "msgpack>=1.0.0",
  "httpx[socks]>=0.27.0",
  "selectolax>=0.3.0",
  "pyyaml>=6.0",
  "click>=8.0",
  "colorama>=0.4.6",
  "cryptography>=42.0",
  "qrcode>=7.4",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]
mdns = ["zeroconf>=0.132.0"]

[project.scripts]
octopus = "swarm.entrypoint:main"
gemaxi = "swarm.entrypoint:main"

[tool.setuptools.packages.find]
include = ["swarm*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
