name: Production Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  production-gate:
    name: Production Gate Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install fastapi httpx

      - name: Runtime validation
        run: |
          octopus doctor

      - name: Regression suite (integration waves)
        run: |
          python -m pytest -q tests/test_agent_supervisor.py tests/test_supervisor_execution_engine.py tests/test_supervisor_graph.py tests/test_supervisor_result_aggregator.py tests/test_agent_executor_protocol.py tests/test_api_app.py tests/test_api_hardening.py tests/test_api_main.py tests/test_auth_config.py tests/test_autonomous_loop.py tests/test_autonomous_loop_persistence.py tests/test_bootstrap_heartbeat.py tests/test_bootstrap_leases.py tests/test_bootstrap_reconciliation_report.py tests/test_bootstrap_recovery_policy.py tests/test_crash_recovery_simulation.py tests/test_event_bus_isolation.py tests/test_execution_audit.py tests/test_execution_audit_idempotency.py tests/test_execution_audit_lifecycle.py tests/test_execution_commit.py tests/test_execution_lease.py tests/test_execution_lease_renewal.py tests/test_execution_state_machine.py tests/test_execution_state_machine_domain.py tests/test_execution_store.py tests/test_lease_aware_checkpoint.py tests/test_loop_state_transitions.py tests/test_pr252_permission_boundary.py tests/test_recovery_checkpoint_integration.py tests/test_recovery_http.py tests/test_recovery_manager.py tests/test_recovery_policy.py tests/test_recovery_queue.py tests/test_recovery_rbac_matrix.py tests/test_reflection_bridge.py tests/test_runtime_bootstrap.py tests/test_runtime_orchestrator.py tests/test_runtime_orchestrator_failure.py tests/test_security_hardening.py tests/test_shutdown_manager.py tests/test_shutdown_recovery_integration.py tests/test_startup_recovery_e2e.py tests/test_tool_protocol.py tests/test_tool_registry.py tests/test_tgbot_bridge.py tests/test_market_regime.py tests/test_quant_directional_policy.py tests/test_quant_directional_v2.py tests/test_quant_port.py tests/test_quant_report_formatters.py tests/test_quant_trade_introspection.py tests/test_quant_trading_accounting.py tests/test_quant_trading_fees_risk.py tests/test_run_quant_trading_v2.py tests/test_tg_quant_cmds.py tests/test_dashboards_port.py  tests/test_t2_metrics.py tests/test_t2_paper.py tests/test_t2_port.py tests/test_collectors_port.py tests/test_mm_queue_model.py tests/test_quant_backfill_pagination.py tests/test_quant_arbitrage_oos.py tests/test_quant_cross_sectional.py tests/test_quant_low_frequency_trend.py tests/test_quant_pairs_oos.py tests/test_quant_regime_v3.py tests/test_quant_signal_product.py tests/test_quant_strategy_scoreboard.py tests/test_quant_v2_gate.py tests/test_quant_walkforward_v2.py tests/test_quant_ab_report.py tests/test_quant_ab_verdict.py tests/test_compare_quant_research.py

      - name: Architecture checks
        run: |
          ruff check swarm/supervisor/ swarm/tools_runtime/ swarm/tgbot/ swarm/quant/ swarm/dashboards/__init__.py swarm/dashboards/operator_dashboard_api.py swarm/dashboards/ai_safety_dashboard.py swarm/dashboards/dashboard_websocket_test.py swarm/dashboards/seed_dashboard_data.py scripts/aios/freqtrade/ scripts/aios/collectors/
          python -m pytest -q tests/test_config_app.py tests/test_auth.py

      - name: Production candidate gate
        run: |
          echo "Production candidate approved after green checks"
